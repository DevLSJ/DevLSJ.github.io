<!-- ───────── top bar (HOME · GITHUB · CAPSTONE · PROFILE  |  search · FOLLOW) ───────── -->
<header class="topbar">
  <div class="wrap">
    <nav class="topnav" id="topnav" aria-label="Primary"></nav>
    <form class="search" id="search" role="search" onsubmit="return false">
      <label class="sr-only" for="q">Search projects</label>
      <input id="q" type="search" placeholder="Search" autocomplete="off">
      <a class="btn-post" id="followBtn" href="#">FOLLOW</a>
    </form>
  </div>
</header>

<main class="page">
  <!-- ───────── banner + avatar + tabs ─────────
       assets/banner.jpg  : wide header art (1200×480 or larger). Falls back to the pastel placeholder.
       assets/avatar.png  : square avatar. Falls back to assets/avatar-placeholder.svg.
       assets/chibi.png   : optional full-body cut-out shown next to the avatar (transparent PNG). -->
  <section class="hero" id="top">
    <div class="bannerbox">
      <div class="banner"><img src="assets/banner.jpg" alt="" onerror="this.remove()"></div>
      <div class="avatar"><img src="assets/avatar.png" alt="DevLSJ avatar" onerror="this.onerror=null;this.src='assets/avatar-placeholder.svg'"></div>
      <img class="chibi" src="assets/chibi.png" alt="" onerror="this.remove()">
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </section>

  <div class="columns">
    <!-- ───────── sidebar ───────── -->
    <aside class="sidebar">
      <div class="who">
        <h1 class="name" id="name"></h1>
        <a class="handle" id="handle" href="#"></a>
        <p class="tagline" id="tagline"></p>
        <p class="bio" id="bio"></p>
        <p class="joined"><svg class="ic"><use href="#i-calendar"/></svg><span id="joined"></span></p>
      </div>

      <section class="box" id="now">
        <h2 id="nowTitle"></h2>
        <div class="boxtext" id="nowBody"></div>
      </section>

      <section class="box" id="stack">
        <h2>Stack <span class="links"><a href="#projects">Projects</a><a id="viewAllStack" href="#" target="_blank" rel="noopener">View All</a></span></h2>
        <ul class="friends" id="stackList"></ul>
      </section>

      <section class="box" id="obsessions">
        <h2>Current Obsessions</h2>
        <ul class="tags" id="tagList"></ul>
      </section>
    </aside>

    <!-- ───────── feed ───────── -->
    <section class="feed" id="feed">
      <div class="feedtabs" role="tablist">
        <button class="on" role="tab" data-feed="projects" aria-selected="true">Projects</button>
        <button role="tab" data-feed="activity" aria-selected="false">Activity</button>
      </div>

      <div id="feed-projects" role="tabpanel">
        <article class="post about" id="about">
          <svg class="bookmark"><use href="#i-bookmark"/></svg>
          <div class="abouttext">
            <h3>about me</h3>
            <div id="aboutBody"></div>
          </div>
          <!-- assets/about.png : character / illustration shown beside the about text. Falls back to a pastel placeholder. -->
          <img class="art" src="assets/about.png" alt="" onerror="this.onerror=null;this.src='assets/about-placeholder.svg'">
        </article>
        <div class="posted"><span class="lbl">POSTED</span><span id="aboutDate"></span><span class="meta"><svg class="ic"><use href="#i-heart"/></svg><svg class="ic"><use href="#i-repeat"/></svg><span id="aboutNotes">0 notes</span></span></div>

        <article class="post cards" id="projects">
          <h3 class="cardsTitle">projects <span class="links"><a href="#" id="refreshRepos">Refresh</a><a id="viewAllRepos" href="#" target="_blank" rel="noopener">View All</a></span></h3>
          <div id="repoCards" aria-live="polite"><p class="loading">loading repositories…</p></div>
        </article>
        <div class="posted"><span class="lbl">POSTED</span><span id="repoDate"></span><span class="meta"><svg class="ic"><use href="#i-heart"/></svg><svg class="ic"><use href="#i-repeat"/></svg><span id="repoNotes">0 notes</span></span></div>
      </div>

      <div id="feed-activity" role="tabpanel" hidden>
        <article class="post events" id="activity">
          <svg class="bookmark"><use href="#i-bookmark"/></svg>
          <h3>recent activity</h3>
          <ul id="eventList"><li class="loading">loading activity…</li></ul>
        </article>
        <div class="posted"><span class="lbl">SOURCE</span><span id="eventSource">github public events</span></div>
      </div>
    </section>
  </div>

  <footer class="foot" id="contact">
    <span id="footText"></span>
  </footer>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
